[project]
name = "agentgym"
version = "0.1.0"
description = "Agent Evolution Gym — evolve deployable domain-agent capability packages (knowledge, skills, MCP tools) through executable experience"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [{ name = "Max Espinoza" }]
dependencies = [
    "aiosqlite>=0.22.1",
    "fastapi>=0.141.1",
    "fastmcp>=4.0.3,<5",
    "httpx>=0.28.1",
    "mcp>=2.1.1,<3",
    "pydantic>=2.13.5,<3",
    "pyyaml>=6.0.3",
    "structlog>=26.1.0",
    "typer>=0.27.2",
    "uvicorn>=0.52.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.16.6",
    "ty>=0.0.78",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agentgym"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "domains"]
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
