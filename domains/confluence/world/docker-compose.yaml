services:
  confluence:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    working_dir: /workspace
    environment:
      PYTHONPATH: /workspace
      UV_PROJECT_ENVIRONMENT: /tmp/agentgym-venv
    volumes:
      - ../../../:/workspace
    ports:
      - "8000:8000"
    command:
      - uv
      - run
      - --frozen
      - uvicorn
      - domains.confluence.world.api.main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
